<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>WavePet 오디오 캡처 테스트</title>
  <style>
    body {
      margin: 0;
      padding: 16px 20px;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #0f1c2e;
      color: #e6edf5;
    }
    button {
      font: inherit;
      padding: 6px 14px;
      margin-right: 6px;
      cursor: pointer;
    }
    .row { margin: 10px 0; }
    .label { color: #9fb0c3; }
    #level-bar {
      height: 14px;
      width: 0;
      background: #4ade80;
      border-radius: 7px;
    }
    #status.error { color: #f87171; }
    canvas {
      display: block;
      width: 100%;
      height: 160px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="row">
    <button id="start">캡처 시작</button>
    <button id="stop" disabled>정지</button>
    <span id="status" class="label">대기 중: 유튜브를 틀고 [캡처 시작]을 누르세요</span>
  </div>
  <div class="row">
    <span class="label">오디오 트랙:</span> <span id="tracks">-</span>
    &nbsp;&nbsp;
    <span class="label">음량(RMS):</span> <span id="level">-</span>
  </div>
  <div id="level-bar"></div>
  <canvas id="bars"></canvas>
  <script src="test.js"></script>
</body>
</html>

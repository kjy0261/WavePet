name: Build Windows Installer

# v로 시작하는 태그(예: v0.1.0)를 푸시하면 설치 파일을 만들어 GitHub Releases에 올린다.
# Actions 탭에서 직접 실행(workflow_dispatch)하면 설치 파일만 만들어 Artifacts로 받을 수 있다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # 릴리스를 만들고 설치 파일을 올리기 위해 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:win

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WavePet-windows-installer
          path: dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

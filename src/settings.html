<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self' 'unsafe-inline';" />
  <title>WavePet 설정</title>
  <style>
    body {
      margin: 0;
      padding: 16px 18px;
      font: 13px 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #1f232b;
      color: #e8ebf0;
      user-select: none;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: #9aa3b2;
    }
    section { margin-bottom: 16px; }
    #presets {
      display: flex;
      gap: 10px;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
    }
    .swatch.selected { border-color: #ffffff; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type='color'] {
      width: 44px;
      height: 28px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    input[type='range'] { flex: 1; }
    #color-value, #opacity-value {
      font-variant-numeric: tabular-nums;
      color: #c3c9d4;
      min-width: 44px;
    }
    button#reset {
      font: inherit;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a404c;
      background: #2a2f39;
      color: #e8ebf0;
      cursor: pointer;
    }
    button#reset:hover { background: #343a46; }
    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 700;
    }
    hr {
      border: none;
      border-top: 1px solid #333945;
      margin: 18px 0 16px;
    }
    #faces {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .face {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 4px;
      border-radius: 10px;
      background: #262b34;
    }
    .face-label { font-size: 12px; color: #c3c9d4; }
    .preview {
      width: 76px;
      height: 76px;
      border-radius: 8px;
      background: #3b414e;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .preview .none {
      display: none;
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      color: #8a93a3;
    }
    .preview.empty img { display: none; }
    .preview.empty .none { display: block; }
    .face .buttons { display: flex; gap: 4px; }
    .face button {
      white-space: nowrap;
      font: 11px 'Segoe UI', 'Malgun Gothic', sans-serif;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #3a404c;
      background: #2f3540;
      color: #e8ebf0;
      cursor: pointer;
    }
    .face button:hover { background: #3a4150; }
    .face button:disabled { opacity: 0.4; cursor: default; }
    .hint { margin-top: 8px; font-size: 11px; color: #8a93a3; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>캐릭터</h1>
  <div id="faces">
    <div class="face" data-slot="idle">
      <span class="face-label">노래 안 들을 때</span>
      <div class="preview"><img alt="노래 안 들을 때 이미지" /><span class="none">없음<br />기울여 대신</span></div>
      <div class="buttons">
        <button class="pick">바꾸기</button>
        <button class="reset">기본</button>
      </div>
    </div>
    <div class="face" data-slot="left">
      <span class="face-label">들을 때 · 왼쪽</span>
      <div class="preview"><img alt="들을 때 왼쪽 이미지" /><span class="none">없음<br />기울여 대신</span></div>
      <div class="buttons">
        <button class="pick">바꾸기</button>
        <button class="reset">기본</button>
      </div>
    </div>
    <div class="face" data-slot="right">
      <span class="face-label">들을 때 · 오른쪽</span>
      <div class="preview"><img alt="들을 때 오른쪽 이미지" /><span class="none">없음<br />기울여 대신</span></div>
      <div class="buttons">
        <button class="pick">바꾸기</button>
        <button class="reset">기본</button>
      </div>
    </div>
  </div>
  <div class="hint">노래를 들을 때는 '왼쪽'과 '오른쪽' 그림을 번갈아 보여 주며 고개를 까딱입니다. 그림이 없으면 '노래 안 들을 때' 그림을 기울여 대신합니다.<br />투명 배경 PNG, 정사각형(512×512 권장)에 모든 그림의 캐릭터 위치를 똑같이 맞추면 자연스럽습니다.</div>

  <hr />
  <h1>배경</h1>
  <section>
    <h2>빠른 선택</h2>
    <div id="presets"></div>
  </section>
  <section>
    <h2>직접 고르기</h2>
    <div class="row">
      <input id="color" type="color" />
      <span id="color-value"></span>
    </div>
  </section>
  <section>
    <h2>불투명도</h2>
    <div class="row">
      <input id="opacity" type="range" min="20" max="100" step="1" />
      <span id="opacity-value"></span>
    </div>
  </section>
  <button id="reset">배경 기본값으로</button>
  <script src="settings.js"></script>
</body>
</html>
